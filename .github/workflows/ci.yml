name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
        exclude:
          # Keep Windows to a single interpreter to save CI minutes.
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest --cov=gitshield tests/

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked --all-extras

      - name: Ruff
        run: uv run ruff check gitshield tests

      - name: Mypy
        run: uv run mypy gitshield

  self-scan:
    name: GitShield self-scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Runs this repository's own action.yml, so a change to the action (or to an action it
      # pins) is exercised on the pull request that makes it.
      - name: Scan pull request diff
        uses: ./
        with:
          # Fork PRs get a read-only token, so the upload would fail; the scan still gates them.
          upload-sarif: ${{ github.event.pull_request.head.repo.full_name == github.repository }}

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
