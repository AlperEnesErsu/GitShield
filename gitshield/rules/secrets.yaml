rules:
  - id: 'SEC-AWS-001'
    title: 'AWS Access Key ID Leaked'
    description: 'Hardcoded AWS Access Key ID detected in code.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: '(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'
    cwe: 'CWE-798'
    remediation: 'Move the AWS credentials into environment variables (AWS_ACCESS_KEY_ID) or use IAM Roles/AWS Secrets Manager.'

  - id: 'SEC-GH-002'
    title: 'GitHub Personal Access Token'
    description: 'GitHub Personal Access Token (classic or fine-grained) detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: '(?:ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{82})'
    cwe: 'CWE-798'
    remediation: 'Revoke this token immediately and store it in GitHub Secrets or local .env file.'

  - id: 'SEC-GH-007'
    title: 'GitHub OAuth / App / Refresh Token'
    description: 'GitHub OAuth, user-to-server, server-to-server or refresh token detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: '(?<![A-Za-z0-9_])gh[ousr]_[A-Za-z0-9]{36}(?![A-Za-z0-9])'
    cwe: 'CWE-798'
    remediation: 'Revoke the token in GitHub settings and load it from GitHub Secrets or environment variables.'

  - id: 'SEC-OAI-003'
    title: 'OpenAI / LLM API Key'
    description: 'Hardcoded OpenAI / AI service API key detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    # Negative lookahead: Anthropic keys (sk-ant-...) are reported by SEC-ANT-012 only.
    pattern: '(?<![A-Za-z0-9])sk-(?!ant-)(?:proj-)?[a-zA-Z0-9_-]{32,}'
    cwe: 'CWE-798'
    remediation: "Read the API key dynamically using `os.getenv('OPENAI_API_KEY')`."

  - id: 'SEC-ANT-012'
    title: 'Anthropic API Key'
    description: 'Hardcoded Anthropic API key (sk-ant-) detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: 'sk-ant-[A-Za-z0-9_-]{32,}'
    cwe: 'CWE-798'
    remediation: "Read the key from the environment (`os.getenv('ANTHROPIC_API_KEY')`) and revoke the leaked key."

  - id: 'SEC-SLACK-008'
    title: 'Slack Token'
    description: 'Slack bot, user, app or refresh token (xox*) detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: 'xox[baprs]-[0-9A-Za-z-]{10,}'
    cwe: 'CWE-798'
    remediation: 'Rotate the Slack token in the Slack app settings and load it from a secret store.'

  - id: 'SEC-SLACK-009'
    title: 'Slack Incoming Webhook URL'
    description: 'Slack incoming webhook URL detected; anyone holding it can post to the channel.'
    severity: 'HIGH'
    rule_type: 'SECRET'
    pattern: 'https://hooks\.slack\.com/services/T[A-Z0-9]{8,12}/B[A-Z0-9]{8,12}/[A-Za-z0-9]{20,30}'
    cwe: 'CWE-798'
    remediation: 'Regenerate the webhook URL in Slack and store it in an environment variable.'

  - id: 'SEC-STRIPE-010'
    title: 'Stripe Live Secret or Restricted Key'
    description: 'Stripe live-mode secret key (sk_live_) or restricted key (rk_live_) detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: '(?<![A-Za-z0-9])(?:sk|rk)_live_[0-9a-zA-Z]{24,}'
    cwe: 'CWE-798'
    remediation: 'Roll the key in the Stripe dashboard and load it from environment variables.'

  - id: 'SEC-GCP-011'
    title: 'Google API Key'
    description: 'Google API key (AIza...) detected.'
    severity: 'HIGH'
    rule_type: 'SECRET'
    pattern: 'AIza[0-9A-Za-z_-]{35}'
    cwe: 'CWE-798'
    remediation: 'Restrict or regenerate the key in the Google Cloud console and load it from a secret store.'

  - id: 'SEC-NPM-013'
    title: 'npm Access Token'
    description: 'npm automation or publish token detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: '(?<![A-Za-z0-9_])npm_[A-Za-z0-9]{36}(?![A-Za-z0-9])'
    cwe: 'CWE-798'
    remediation: 'Revoke the token on npmjs.com and inject it through the CI secret store (NPM_TOKEN).'

  - id: 'SEC-PYPI-014'
    title: 'PyPI API Token'
    description: 'PyPI upload token detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: 'pypi-AgEIcHlwaS5vcmc[A-Za-z0-9_-]{50,}'
    cwe: 'CWE-798'
    remediation: 'Revoke the token on pypi.org and provide it through environment variables or trusted publishing.'

  - id: 'SEC-AZURE-015'
    title: 'Azure Storage Account Key'
    description: 'Azure storage connection string contains an AccountKey.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: 'AccountKey=[A-Za-z0-9+/]{86}=='
    cwe: 'CWE-798'
    remediation: 'Rotate the storage account key and use Azure Key Vault or managed identities.'

  - id: 'SEC-TWILIO-016'
    title: 'Twilio API Key SID'
    description: 'Twilio API key SID (SK followed by 32 hex characters) detected.'
    severity: 'HIGH'
    rule_type: 'SECRET'
    pattern: '(?<![A-Za-z0-9])SK[0-9a-fA-F]{32}(?![A-Za-z0-9])'
    cwe: 'CWE-798'
    remediation: 'Delete the API key in the Twilio console and load credentials from environment variables.'

  - id: 'SEC-SENDGRID-017'
    title: 'SendGrid API Key'
    description: 'SendGrid API key (SG.<id>.<secret>) detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: 'SG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}'
    cwe: 'CWE-798'
    remediation: 'Revoke the key in SendGrid and load it from a secret store.'

  - id: 'SEC-DISCORD-018'
    title: 'Discord Webhook URL'
    description: 'Discord webhook URL detected; anyone holding it can post to the channel.'
    severity: 'HIGH'
    rule_type: 'SECRET'
    pattern: 'https://(?:(?:ptb|canary)\.)?discord(?:app)?\.com/api/webhooks/\d{17,20}/[A-Za-z0-9_-]{60,}'
    cwe: 'CWE-798'
    remediation: 'Delete and recreate the webhook in Discord and store its URL in an environment variable.'

  - id: 'SEC-TG-019'
    title: 'Telegram Bot Token'
    description: 'Telegram bot token (<id>:<secret>) detected.'
    severity: 'HIGH'
    rule_type: 'SECRET'
    pattern: '(?<![\w:])\d{8,10}:[A-Za-z0-9_-]{35}(?![A-Za-z0-9_-])'
    cwe: 'CWE-798'
    remediation: 'Revoke the bot token with BotFather (/revoke) and load it from environment variables.'

  - id: 'SEC-DB-020'
    title: 'Database Connection String with Inline Password'
    description: 'Connection string embeds a password in the URL (user:password@host).'
    severity: 'HIGH'
    rule_type: 'SECRET'
    pattern: '(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|rediss?|amqps?)://[^\s:/@\x27"]+:(?P<value>[^\s@\x27"]+)@[^\s\x27"]+'
    skip_placeholders: true
    cwe: 'CWE-798'
    remediation: 'Build the connection string at runtime from environment variables (DATABASE_URL) or a secret manager.'

  - id: 'SEC-PRIVKEY-004'
    title: 'Private Cryptographic Key'
    description: 'Embedded private encryption/signing key block found.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: '-----BEGIN (?:(?:RSA|EC|OPENSSH|DSA|PGP|ENCRYPTED) )?PRIVATE KEY(?: BLOCK)?-----'
    cwe: 'CWE-312'
    remediation: 'Never commit private keys to source repositories. Mount via secure secret volume or KMS.'

  - id: 'SEC-JWT-005'
    title: 'Hardcoded JSON Web Token (JWT)'
    description: 'Static JWT token found committed in source code.'
    severity: 'HIGH'
    rule_type: 'SECRET'
    pattern: 'eyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}'
    cwe: 'CWE-798'
    remediation: 'Generate and sign JWT tokens at runtime. Do not hardcode static tokens.'

  - id: 'SEC-GEN-006'
    title: 'Hardcoded Secret / Password Assignment'
    description: 'Variable assignment containing plain text secret or credential.'
    severity: 'HIGH'
    rule_type: 'SECRET'
    pattern: '(?i)(?:password|passwd|secret|api_key|app_secret|auth_token)\s*[:=]\s*["''](?P<value>[^"''\s]{8,})["'']'
    skip_placeholders: true
    exclude_patterns: ['*.md']
    cwe: 'CWE-798'
    remediation: 'Load credentials from environment variables or a secret vault.'
