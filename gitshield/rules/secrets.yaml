rules:
  - id: 'SEC-AWS-001'
    title: 'AWS Access Key ID Leaked'
    description: 'Hardcoded AWS Access Key ID detected in code.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: '(?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}'
    cwe: 'CWE-798'
    remediation: 'Move the AWS credentials into environment variables (AWS_ACCESS_KEY_ID) or use IAM Roles/AWS Secrets Manager.'

  - id: 'SEC-GH-002'
    title: 'GitHub Personal Access Token'
    description: 'GitHub Personal Access Token (classic or fine-grained) detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: '(?:ghp_[a-zA-Z0-9]{36}|github_pat_[a-zA-Z0-9_]{82})'
    cwe: 'CWE-798'
    remediation: 'Revoke this token immediately and store it in GitHub Secrets or local .env file.'

  - id: 'SEC-OAI-003'
    title: 'OpenAI / LLM API Key'
    description: 'Hardcoded OpenAI / AI service API key detected.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: 'sk-(?:proj-)?[a-zA-Z0-9_-]{32,}'
    cwe: 'CWE-798'
    remediation: "Read the API key dynamically using `os.getenv('OPENAI_API_KEY')`."

  - id: 'SEC-PRIVKEY-004'
    title: 'Private Cryptographic Key'
    description: 'Embedded private encryption/signing key block found.'
    severity: 'CRITICAL'
    rule_type: 'SECRET'
    pattern: '-----BEGIN (?:RSA |EC |OPENSSH |DSA |PGP )?PRIVATE KEY-----'
    cwe: 'CWE-312'
    remediation: 'Never commit private keys to source repositories. Mount via secure secret volume or KMS.'

  - id: 'SEC-JWT-005'
    title: 'Hardcoded JSON Web Token (JWT)'
    description: 'Static JWT token found committed in source code.'
    severity: 'HIGH'
    rule_type: 'SECRET'
    pattern: 'eyJ[a-zA-Z0-9_-]{10,}\.eyJ[a-zA-Z0-9_-]{10,}\.[a-zA-Z0-9_-]{10,}'
    cwe: 'CWE-798'
    remediation: 'Generate and sign JWT tokens at runtime. Do not hardcode static tokens.'

  - id: 'SEC-GEN-006'
    title: 'Hardcoded Secret / Password Assignment'
    description: 'Variable assignment containing plain text secret or credential.'
    severity: 'HIGH'
    rule_type: 'SECRET'
    pattern: '(?i)(?:password|passwd|secret|api_key|app_secret|auth_token)\s*[:=]\s*["''][^"''\s]{8,}["'']'
    cwe: 'CWE-798'
    remediation: 'Load credentials from environment variables or a secret vault.'
