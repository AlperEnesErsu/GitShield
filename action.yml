name: "GitShield PR Security Scan"
description: >-
  Scans the diff of a pull request for hardcoded secrets and OWASP-style
  vulnerabilities with GitShield, writes a SARIF report, and uploads it to
  GitHub code scanning. Fails the job on HIGH/CRITICAL findings (exit 1) or on
  scan errors (any other non-zero exit).
  Requirements: the caller must check out the repository with full history, e.g.
  `actions/checkout@v4` with `fetch-depth: 0`, so the base commit is available.
  To upload SARIF, the calling job needs `permissions: { contents: read, security-events: write }`.

inputs:
  base-ref:
    description: "Base commit (or ref) to diff against. Defaults to the pull request base SHA."
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  format:
    description: "Report format passed to `gitshield scan --format` (sarif, json or console)."
    required: false
    default: "sarif"
  output:
    description: "Path of the report file, relative to the workspace."
    required: false
    default: "gitshield.sarif"
  fail-on-high:
    description: "Fail the job when HIGH or CRITICAL findings are detected. Scan errors always fail."
    required: false
    default: "true"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning (requires format: sarif)."
    required: false
    default: "true"
  python-version:
    description: "Python version used to install GitShield."
    required: false
    default: "3.12"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install GitShield
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install "$ACTION_PATH"

    - name: Run GitShield scan
      id: scan
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        REPORT_FORMAT: ${{ inputs.format }}
        REPORT_OUTPUT: ${{ inputs.output }}
        FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
      run: |
        if [ -z "$BASE_REF" ]; then
          echo "::error::base-ref is empty. This action must run on pull_request events, or base-ref must be set."
          echo "exit-code=2" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        args=(scan --branch "${BASE_REF}...HEAD" --format "$REPORT_FORMAT" --output "$REPORT_OUTPUT")
        if [ "$FAIL_ON_HIGH" != "true" ]; then
          args+=(--no-fail)
        fi
        # Capture the exit code instead of failing here, so SARIF upload still runs.
        set +e
        gitshield "${args[@]}"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF to code scanning
      if: always() && inputs.upload-sarif == 'true' && inputs.format == 'sarif' && hashFiles(inputs.output) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}

    - name: Fail on scan result
      if: always()
      shell: bash
      env:
        SCAN_EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
      run: |
        case "$SCAN_EXIT_CODE" in
          0)
            echo "GitShield: no blocking findings."
            ;;
          1)
            echo "::error::GitShield found HIGH or CRITICAL issues."
            exit 1
            ;;
          *)
            echo "::error::GitShield scan failed (exit code: ${SCAN_EXIT_CODE:-unknown})."
            exit 1
            ;;
        esac
